language: cpp
compiler: gcc
os: linux
sudo: required
dist: trusty
env:
  - QT_BASE=55
branches:
  only:
    - master
    - develop

addons:
  apt:
    packages:
      - build-essential
      - libboost-all-dev
      - libdb++-dev
      - libminiupnpc-dev
      - libqrencode-dev
      - libprotobuf-dev
      - libssl-dev
      - libgmp3-dev

before_install:
  - sudo add-apt-repository --yes ppa:beineri/opt-qt551-trusty
  - sudo apt-get update -qq

install:
  - sudo apt-get -y install qt55base qt55tools
  - cd src
 
script: 
  - make -f makefile.unix -j 5 slimcoind
  - make -f makefile.unix test_slimcoin
  - ./test_slimcoin -r short
  - cd ..
  - source /opt/qt55/bin/qt55-env.sh
  #- /opt/qt55/bin/qmake RELEASE=1 USE_QRCODE=1 FIRST_CLASS_MESSAGING=1 USE_UPNPC=1 USE_OLDC=1
  # The above original line was replaced with thos following this comment's section because USE_UPNPC is probably a typo, the original value was USE_UPNP, while USE_OLDC is useless with this qmake command, it's used in src/makefile.unix (to choose -std=c++0x vs -std=c++11) but this qmake command creates another Makefile which doesn't have that variable. Both typos was introduced in 2017 in the same commit
  #Another point changed in the mentioned line is that.travis.yml used to call qmake without explicitly naming slimcoin-qt.pro (qmake can find a .pro file in cwd, but being explicit is clearer)
  #Also the quotes was added, since with quotes it should be safer.
  - /opt/qt55/bin/qmake "RELEASE=1" "USE_QRCODE=1" "FIRST_CLASS_MESSAGING=1" "USE_UPNP=1" slimcoin-qt.pro
  #- CXXFLAGS="-std=c++0x" make -j 5
  # The above commented original line was replaced with that placed after this comment 
  # because passing CXXFLAGS="-std=c++0x" here has no effect on the qmake-generated build
  # created by the previous not commented command (/opt/qt55/bin/qmake "RELEASE=1" "USE_QRCODE=1" "FIRST_CLASS_MESSAGING=1" "USE_UPNP=1" slimcoin-qt.pro). 
# The C++ standard is selected inside slimcoin-qt.pro based on the Qt version:
#
# - Qt < 5.4: CONFIG += c++11 is used, but the C++11 flag is rewritten to
#   use -std=c++1y for compatibility with older compilers.
# - Qt >= 5.4: CONFIG += c++14 is used directly.
  - make -j 5

notifications:
  irc:
    channels:
      - "chat.freenode.net#slimcoin"
    template:
      - "%{repository}/%{branch} (%{commit} - %{author}): %{message}"
      - "Alt Message : %{repository_slug} - (%{commit} - %{author}): %{message}, Build Time: %{duration}"
      - "Change view : %{compare_url}"
      - "Build details : %{build_url}"
after_success:
  - wget https://raw.githubusercontent.com/DiscordHooks/travis-ci-discord-webhook/master/send.sh
  - chmod +x send.sh
  - ./send.sh success $WEBHOOK_URL
after_failure:
  - wget https://raw.githubusercontent.com/DiscordHooks/travis-ci-discord-webhook/master/send.sh
  - chmod +x send.sh
  - ./send.sh failure $WEBHOOK_URL
  
